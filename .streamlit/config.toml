# Tema del panel. Antes eran seis líneas con la sintaxis de 2023; Streamlit 1.60
# expone unas sesenta opciones y permite separar claro, oscuro y barra lateral.
#
# Lo que más rinde de aquí son las tres paletas de gráfico: se declaran UNA vez
# y las heredan los treinta y cinco gráficos de Plotly vía `theme="streamlit"`.
# Antes cada módulo quemaba sus colores a mano, que es la razón por la que dos
# pantallas usaban azules distintos para lo mismo.

[theme]
base = "light"

# La marca sale del logo real de kyva.co, no del ojo.
primaryColor = "#CE6264"              # coral: el color de ACCIÓN.
                                      # El navy es la tinta del texto; usarlo
                                      # de primario hace que cada control
                                      # compita con lo que hay que leer.
backgroundColor = "#FAF9FB"
secondaryBackgroundColor = "#F4F2F5"
textColor = "#0E113A"
linkColor = "#CE6264"                 # coral — el secundario de la marca
borderColor = "#E5E1E6"               # pálido — las letras del logo
dataframeBorderColor = "#E5E1E6"
dataframeHeaderBackgroundColor = "#F4F2F5"

font = "Montserrat"
headingFont = "DM Serif Display"
baseFontSize = 14
baseRadius = "small"
buttonRadius = "medium"
showWidgetBorder = true
linkUnderline = false

# ── Las paletas de gráfico ───────────────────────────────────────────────────
# Categórica: los pares adyacentes se distinguen también con daltonismo. El
# orden es fijo a propósito — el color debe seguir a la entidad, no a su puesto
# en el ranking, o al filtrar por ciudad los supervivientes cambian de color y
# el lector cree que cambió el dato.
# Validada con OKLab y simulación de daltonismo (Machado, severidad 1.0):
# ΔE mínimo 15,5 en visión normal y 8,8 con daltonismo, contraste sobre blanco
# por encima de 3 en las cuatro. La anterior fallaba: coral contra gris daba
# 14,8 con un piso de 15, y son dos canales que van pegados en cada barra
# apilada. El navy salió de la paleta de series porque a L=0,21 no lee como
# color sino como tinta — una barra apilada parecía un bloque negro al lado de
# dos pasteles invisibles.
#
# A partir de la quinta serie NO se genera un tono nuevo: se agrupa en «Otros».
chartCategoricalColors = [
  "#4F5BB5",  # índigo
  "#CE6264",  # coral de marca
  "#0E9A94",  # jade
  "#8D5912",  # coñac
  "#0E113A",  # navy — último, y solo si hace falta una quinta
]

# Secuencial: un solo tono de claro a oscuro. Nunca arcoíris.
chartSequentialColors = [
  "#EDEDF2", "#C9CBDA", "#9EA2C0", "#6E74A2",
  "#484E85", "#2B3167", "#0E113A",
]

# Divergente: dos tonos con un neutro real en el centro. El centro es el color
# de fondo secundario y no un gris cualquiera, así el cero desaparece de la
# vista — que es exactamente lo que debe hacer.
chartDivergingColors = [
  "#8B1E1E", "#CE6264", "#F6DEDE", "#F4F2F5",
  "#C9CBDA", "#484E85", "#0E113A",
]

[theme.sidebar]
backgroundColor = "#0E113A"
secondaryBackgroundColor = "#1A1E4A"
textColor = "#E5E1E6"
primaryColor = "#CE6264"
borderColor = "#252A5C"
showSidebarBorder = false

[browser]
gatherUsageStats = false

# El vigilante vuelve a estar encendido, y ahora sí se puede.
#
# Estuvo apagado porque el registro de visitas se escribía dentro del propio
# directorio del panel: cada visita parecía un cambio de código, recargaba, y
# el panel se quedaba en "your app is in the oven" (ya había pasado en
# paranice-demo). Pero apagarlo trajo algo peor — Streamlit Cloud dejó de
# enterarse de los despliegues nuevos y el contenedor siguió sirviendo el
# código del arranque durante horas, con el código correcto ya en GitHub.
#
# Ahora el registro vive fuera del árbol (ver utils/visitas.py), así que el
# vigilante no lo ve. `runOnSave` sigue SIN poner: vigilar basta para que un
# despliegue nuevo se recompile; recargar solo no hace falta.
[server]
fileWatcherType = "auto"

[client]
showErrorDetails = false
toolbarMode = "minimal"
